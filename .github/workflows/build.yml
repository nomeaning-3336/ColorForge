name: build

on:
  push:
  pull_request:

jobs:
  windows-mingw:
    name: Windows VST3 + player (MinGW cross-build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 ninja-build
      - name: Fetch JUCE 7.0.12
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE7
      - name: Configure
        run: cmake -S . -B build-xmingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DCF_JUCE_DIR=JUCE7 -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
      - name: Build
        run: cmake --build build-xmingw --target ColorForge_VST3 ColorForgePlayer
      - uses: actions/upload-artifact@v4
        with:
          name: ColorForge-win64
          path: |
            build-xmingw/ColorForge_artefacts/Release/VST3/
            build-xmingw/ColorForgePlayer_artefacts/Release/*.exe

  dsp-tests:
    name: DSP tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev
          libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libxext-dev
      - name: Fetch JUCE 7.0.12
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE7
      - name: Build tests
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCF_JUCE_DIR=JUCE7
          cmake --build build-linux --target ColorForgeTests
      - name: Run tests
        run: ./build-linux/ColorForgeTests_artefacts/Release/ColorForgeTests

name: release

# Builds the Windows VST3 and the standalone player and publishes them as a GitHub release.
# Run it from the Actions tab (or the API) with the tag to create, e.g. v2.0.0. The release
# text comes from docs/release-notes/<tag>.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v2.0.0"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 ninja-build zip libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libasound2-dev
      - name: Fetch JUCE 7.0.12
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE7
      - name: Configure
        run: cmake -S . -B build-xmingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DCF_JUCE_DIR=JUCE7 -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
      - name: Build
        run: cmake --build build-xmingw --target ColorForge_VST3 ColorForgePlayer
      - name: Package
        run: |
          mkdir dist
          (cd build-xmingw/ColorForge_artefacts/Release/VST3 && zip -r -q "$GITHUB_WORKSPACE/dist/ColorForge-VST3-win64.zip" ColorForge.vst3)
          cp "build-xmingw/ColorForgePlayer_artefacts/Release/ColorForge Player.exe" dist/ColorForge-Player-win64.exe
          ls -la dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          notes="docs/release-notes/${TAG}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "ColorForge ${TAG#v}" --notes-file "$notes"
